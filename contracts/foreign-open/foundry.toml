[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
# Base build of forge executes the B20 precompiles (real BRIAN / GATEWAY on the fork, no mock).
base = true
# FORK ONLY. NEVER --broadcast. Nothing here deploys to mainnet or signs with a real key.
#   ~/.foundry/versions/base-nightly/forge test --fork-url <Base RPC> --fork-block-number 52074194 -vv
# Flag OFF in the app (marche-ouvert.js HOOK_MARCHE_OUVERT = null, MARCHE_OUVERT_ACTIF = false) until Phil's GO + audit.
remappings = [
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "v4-core/=lib/v4-core/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
  "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
]

[lint]
lint_on_build = false
