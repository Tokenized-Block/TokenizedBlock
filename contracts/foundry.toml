[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# 2026-10-25: forge used to AUTO-DETECT this from lib/forge-std (a junction). It is part of the metadata hash of every deployed
# contract (BlockDuelsV2, BlockSlots, ... verified Exact Match on Basescan only with it): without lib/forge-std the CBOR tail
# changes. Declared here so a build without the junction still reproduces the deployed bytecode. See test-forge-remappings.
remappings = ["forge-std/=lib/forge-std/src/"]

