<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block contest — TokenizedBlock</title>
<style>
  :root { --bg:#07080d; --card:rgba(20,24,35,.78); --line:#232a38; --txt:#eef1f7; --mut:#93a0b5; --ok:#3ddc97; --ko:#ff6b6b; --acc:#8fb0ff; --acc2:#c18cff; --gold:#ffd166; --warn:#ffc857; }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--txt); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh;
    background: radial-gradient(900px 500px at 15% -10%, rgba(143,176,255,.18), transparent 60%), radial-gradient(800px 500px at 100% 0%, rgba(193,140,255,.16), transparent 60%), var(--bg); background-attachment: fixed; }
  main { max-width:760px; margin:0 auto; padding:18px 16px 70px; }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:var(--mut); }
  .brand a { text-decoration:none; }
  h1 { font-size:30px; line-height:1.15; margin:14px 0 6px; letter-spacing:-.02em;
    background: linear-gradient(90deg, #fff, var(--acc) 55%, var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font-size:16px; margin:0 0 10px; letter-spacing:.01em; }
  p { margin:8px 0; }
  .mut { color:var(--mut); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:14px 0; backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .hero { border-color: rgba(143,176,255,.35); box-shadow: 0 0 0 1px rgba(143,176,255,.08), 0 0 50px rgba(143,176,255,.12), 0 10px 30px rgba(0,0,0,.3); }
  .phase { display:flex; gap:6px; margin:4px 0 12px; }
  .phase span { flex:1; text-align:center; font-size:12px; padding:6px 4px; border-radius:99px; border:1px solid var(--line); color:var(--mut); }
  .phase span.on { color:#08101f; background: linear-gradient(90deg, var(--acc), var(--acc2)); border-color:transparent; font-weight:650; }
  .potline { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .pot { font-size:34px; font-weight:750; font-variant-numeric:tabular-nums; color:var(--gold); text-shadow: 0 0 24px rgba(255,209,102,.35); }
  .bar { height:10px; border-radius:99px; background:#0e121a; border:1px solid var(--line); overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; background: linear-gradient(90deg, var(--gold), #ff9f43); box-shadow: 0 0 14px rgba(255,209,102,.6); }
  .fund { border-color: rgba(255,209,102,.4); box-shadow: 0 0 40px rgba(255,209,102,.08), 0 10px 30px rgba(0,0,0,.3); }
  .fund button:not(.ghost) { background: linear-gradient(90deg, var(--gold), #ff9f43); }
  details summary { cursor:pointer; font-weight:650; list-style:none; } details summary::-webkit-details-marker { display:none; }
  details summary::after { content:' ▾'; color:var(--mut); } details[open] summary::after { content:' ▴'; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row span:first-child { color:var(--mut); }
  .row span:last-child { text-align:right; overflow-wrap:anywhere; }
  .big { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; margin:6px 0; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.ko { color:var(--ko); border-color:var(--ko); } .pill.warn { color:var(--warn); border-color:var(--warn); }
  .note { font-size:13px; color:var(--mut); }
  .warnbox { border:1px solid var(--warn); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px; }
  .entry { border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .entry .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .act { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  button { background:var(--acc); color:#08101f; border:0; border-radius:9px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  input { background:#0e121a; color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font:inherit; }
  input.n { width:84px; } input.a { flex:1; min-width:220px; }
  a { color:var(--acc); }
  ol { padding-left:20px; margin:6px 0; } li { margin:7px 0; }
  code { font-size:13px; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <div class="brand"><a href="/">← TokenizedBlock</a><span>Base mainnet · paid in TBLOCK</span></div>
  <h1>Block contest</h1>
  <p class="mut">Creators enter their block. Anyone pays TBLOCK to vote. The contract pays by fixed rules; nobody decides by hand. Every number on this page is read from the contract on Base.</p>

  <div class="card hero" id="status"><p class="mut">Reading the contract on Base…</p></div>
  <div class="card fund" id="fund" hidden></div>
  <div class="card" id="round" hidden></div>
  <div class="card" id="me" hidden></div>
  <div class="card" id="rules" hidden></div>
  <div class="card" id="past" hidden></div>
  <p class="note" id="foot"></p>
</main>

<script type="module">
import * as C from './block-contest.js';
import { displayShort, isFeeAddress } from './frais-creation.js';

/* ---------------------------------------------------------------- reads: Base public nodes, straight from the browser */
const NODES = ['https://base-rpc.publicnode.com', 'https://mainnet.base.org'];
let nodeAt = 0, reqId = 0;
async function node(method, params) {
  let last = new Error('no node answered');
  for (let k = 0; k < NODES.length; k++) {
    const at = (nodeAt + k) % NODES.length;
    try {
      const r = await fetch(NODES[at], { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: ++reqId, method, params }), signal: AbortSignal.timeout(12000) });
      const j = await r.json();
      if (j && j.result !== undefined && j.result !== null) { nodeAt = at; return j.result; }
      const msg = (j && j.error && j.error.message) || 'empty answer';
      if (/revert/i.test(msg)) { const e = new Error(msg); e.reverted = true; throw e; }
      last = new Error(msg);
    } catch (e) { if (e && e.reverted) throw e; last = e; }
  }
  throw last;
}
const call = (to, data) => node('eth_call', [{ to, data }, 'latest']);
const rd = (v) => call(v.to, v.data);

/* ---------------------------------------------------------------- state */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const row = (k, v) => '<div class="row"><span>' + esc(k) + '</span><span>' + v + '</span></div>';
const pill = (t, c) => '<span class="pill ' + c + '">' + esc(t) + '</span>';
/* a fee wallet is shown by its name only: no address, no link (frais-creation.js holds that rule) */
const scan = (a) => isFeeAddress(a) ? esc(displayShort(a)) : '<a href="https://basescan.org/address/' + esc(a) + '" target="_blank" rel="noopener" title="' + esc(a) + '">' + esc(displayShort(a)) + '</a>';
const tok = (raw) => esc(C.formatUnits18(raw)) + ' TBLOCK';
const utc = (ts) => new Date(Number(ts) * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
const pct = (bps) => (Number(bps) / 100).toString() + '%';
const span = (sec) => { const d = Number(sec) / 86400; return Number.isInteger(d) ? d + (d === 1 ? ' day' : ' days') : C.formatDuration(sec); };

let P = null, S = null, dead = null, skew = 0, usd = null, wallet = null, my = null, busy = false, message = '';
const symbols = new Map(), mine = { list: null, why: '' };
const chainNow = () => Math.floor(Date.now() / 1000) + skew;
const dollars = (raw) => (usd ? ' <span class="mut">(about $' + esc((Number(raw) / 1e18 * usd).toFixed(2)) + ' at the pool price read just now)</span>' : '');

async function symbolOf(token) {
  if (symbols.has(token)) return symbols.get(token);
  let s = '';
  try { s = C.decodeString(await rd(C.VIEW.symbol(token))); } catch (_) { s = ''; }
  symbols.set(token, s);
  return s;
}
const nameOf = (token) => (symbols.get(token) ? '<b>' + esc(symbols.get(token)) + '</b> ' : '') + scan(token);

/* ---------------------------------------------------------------- one full read */
async function refresh() {
  try {
    const head = await node('eth_getBlockByNumber', ['latest', false]);
    skew = Number(BigInt(head.timestamp)) - Math.floor(Date.now() / 1000);
    if (!P) { P = await C.readParams(call); dead = C.decodeAddress(await rd(C.VIEW.param('DEAD'))); }
    S = await C.readState(call, { now: chainNow(), params: P });
    for (const e of S.current.entries) await symbolOf(e.blockToken);
    for (const r of S.past) for (const e of r.entries) await symbolOf(e.blockToken);
    try {
      const h = await fetch('/api/tblock/hold', { cache: 'no-store', signal: AbortSignal.timeout(8000) }).then((x) => x.json());
      usd = h && h.ok && Number(h.priceNow) > 0 ? Number(h.priceNow) : null;
    } catch (_) { usd = null; }
    if (wallet) await readWallet();
    S.readError = '';
  } catch (e) {
    S = S || null;
    if (S) S.readError = String((e && e.message) || e); else { $('status').innerHTML = '<h2>Contract not read</h2><p>The Base nodes did not answer (' + esc(String((e && e.message) || e).slice(0, 120)) + '). Nothing is shown until the contract is read. This page retries on its own.</p>'; return; }
  }
  render();
}

async function readWallet() {
  const r = S.chainRound, w = wallet;
  const out = { balance: C.decodeUint(await rd(C.VIEW.balanceOf(w))), claimable: C.decodeUint(await rd(C.VIEW.claimable(w))),
    enteredBy: C.decodeBool(await rd(C.VIEW.enteredBy(r, w))), room: C.decodeUint(await rd(C.VIEW.fundRoom(r))), voted: new Map() };
  for (const e of S.current.entries) out.voted.set(e.id, C.decodeBool(await rd(C.VIEW.hasVoted(r, e.id, w))));
  my = out;
}

/* ---------------------------------------------------------------- the connected wallet's own blocks */
async function readMine(extra) {
  mine.list = null; mine.why = 'Looking for the blocks this wallet created…'; render();
  let blocks = [];
  try {
    const j = await fetch('/api/blocks-de?' + new URLSearchParams({ adr: wallet }), { cache: 'no-store', signal: AbortSignal.timeout(15000) }).then((x) => x.json());
    if (j && j.ok && Array.isArray(j.blocks)) blocks = j.blocks.map((b) => String(b).toLowerCase()).filter((b) => /^0x[0-9a-f]{40}$/.test(b));
  } catch (_) { /* the index is a shortcut only: the address field below still works */ }
  if (extra && !blocks.includes(extra)) blocks.unshift(extra);
  const list = [];
  for (const b of blocks.slice(0, 12)) {
    const item = { block: b, ok: false, why: '', key: null, entered: false };
    await symbolOf(b);
    try {
      const k = await fetch('/api/cle/' + b, { cache: 'no-store', signal: AbortSignal.timeout(20000) }).then((x) => x.json());
      const keys = k && k.ok && Array.isArray(k.cles) ? k.cles.filter((c) => String(c.hooks).toLowerCase() === C.HOOK) : null;
      if (!keys) item.why = 'its pool was not read just now; try again in a minute';
      else if (!keys.length) item.why = 'this block has no pool on the creator registry the contest reads';
      for (const c of keys || []) {
        const key = { currency0: String(c.currency0).toLowerCase(), currency1: String(c.currency1).toLowerCase(), fee: Number(c.fee), tickSpacing: Number(c.tickSpacing), hooks: String(c.hooks).toLowerCase() };
        const chk = await C.readCreatorCheck(call, { blockToken: b, key, wallet });
        if (chk.ok) { item.ok = true; item.key = key; item.why = ''; break; }
        item.why = chk.why;
      }
      if (item.ok) item.entered = C.decodeBool(await rd(C.VIEW.entered(S.chainRound, b)));
    } catch (e) { item.why = 'not read just now (' + String((e && e.message) || e).slice(0, 80) + ')'; }
    list.push(item);
  }
  mine.list = list;
  mine.why = blocks.length ? '' : 'No block created by this wallet is in the index yet. An empty list means the index has not seen one, not that there is none: paste the block address below to check it on the contract.';
  if (blocks.length > 12) mine.why = 'Only the first 12 blocks are checked here. Paste an address below to check another one.';
  render();
}

/* ---------------------------------------------------------------- sending: ONE batch, signed by the user in their own wallet */
async function send(calls, what) {
  if (busy) return;
  busy = true; message = 'Waiting for your wallet: ' + what + '…'; render();
  try {
    const chain = await window.ethereum.request({ method: 'eth_chainId' });
    if (String(chain).toLowerCase() !== C.CHAIN_ID_HEX) throw new Error('your wallet is not on Base; switch it to Base and try again');
    const id = await window.ethereum.request({ method: 'wallet_sendCalls', params: [{ version: '2.0.0', chainId: C.CHAIN_ID_HEX, from: wallet, atomicRequired: true,
      calls: calls.map((c) => ({ to: c.to, data: c.data, value: c.value || '0x0' })) }] });
    const bid = id && (id.id || id);
    message = 'Sent. Waiting for Base to confirm…'; render();
    let done = '';
    for (let i = 0; i < 60 && !done; i++) {
      await new Promise((r) => setTimeout(r, 3000));
      let s = null;
      try { s = await window.ethereum.request({ method: 'wallet_getCallsStatus', params: [bid] }); } catch (_) { s = null; }
      if (s && (s.status === 200 || s.status === 'CONFIRMED' || s.status === 'success')) done = 'ok';
      else if (s && (s.status >= 400 || s.status === 'FAILED')) done = 'ko';
    }
    message = done === 'ok' ? 'Confirmed: ' + what + '.' : done === 'ko' ? 'Refused by the chain: ' + what + '. Nothing was taken beyond network fees.' : 'Not confirmed after 3 minutes. Check your wallet history before trying again.';
  } catch (e) {
    message = 'Not sent: ' + String((e && e.message) || e).slice(0, 160);
  }
  busy = false;
  await refresh();
  if (wallet && mine.list) readMine();
}

async function connect() {
  if (!window.ethereum) { message = 'No wallet found in this browser.'; render(); return; }
  try {
    const a = await window.ethereum.request({ method: 'eth_requestAccounts' });
    wallet = a && a[0] ? String(a[0]).toLowerCase() : null;
  } catch (e) { message = 'Wallet not connected: ' + String((e && e.message) || e).slice(0, 120); }
  if (wallet) { await refresh(); readMine(); } else render();
}

/* ---------------------------------------------------------------- render */
function countdownText() {
  if (!S) return '';
  const w = C.phaseAt(P, chainNow());
  return C.formatDuration(w.secondsLeft);
}
function render() {
  if (!S) return;
  const p = P, w = C.phaseAt(p, chainNow()), cur = S.current;
  /* status */
  let h = '';
  if (w.phase === 'BEFORE_START') {
    h += '<h2>Not started yet</h2><p>The contest has not started. Nothing can be entered and no vote can be bought until it does.</p>'
      + '<p class="mut">Entries open in</p><div class="big" id="cd">' + esc(countdownText()) + '</div><p class="note">Start: ' + esc(utc(p.genesis)) + ', read from the contract.</p>';
  } else if (w.phase === 'ENTRY') {
    h += '<h2>Round ' + w.round + ' — entries are open</h2><p>Creators can enter their block now. No vote can be bought yet.</p>'
      + '<p class="mut">Voting opens in</p><div class="big" id="cd">' + esc(countdownText()) + '</div><p class="note">Voting: ' + esc(utc(w.endsAt)) + ' to ' + esc(utc(w.roundEndsAt)) + '.</p>';
  } else {
    h += '<h2>Round ' + w.round + ' — voting is open</h2><p>Entries for this round are closed.</p>'
      + '<p class="mut">The round ends in</p><div class="big" id="cd">' + esc(countdownText()) + '</div><p class="note">End: ' + esc(utc(w.endsAt)) + '. Votes sent after that second are refused by the contract.</p>';
  }
  const fill = p.maxPot > 0n ? Number(cur.pot * 1000n / p.maxPot) / 10 : 0;
  h = '<div class="phase"><span' + (w.phase === 'BEFORE_START' ? ' class="on"' : '') + '>Starts</span><span' + (w.phase === 'ENTRY' ? ' class="on"' : '') + '>Entries</span><span' + (w.phase === 'VOTE' ? ' class="on"' : '') + '>Voting</span><span>Paid</span></div>' + h
    + '<div class="potline"><span class="mut">Pot of ' + (w.phase === 'BEFORE_START' ? 'the first round' : 'round ' + S.chainRound) + '</span><span class="pot">' + tok(cur.pot) + '</span></div>'
    + '<div class="bar" role="img" aria-label="pot ' + fill + '% of its cap"><i style="width:' + Math.min(100, fill) + '%"></i></div>'
    + '<p class="note">' + fill + '% of the cap of ' + tok(p.maxPot) + dollars(p.maxPot) + '.</p>';
  if (S.readError) h += '<div class="warnbox">The last refresh failed (' + esc(S.readError.slice(0, 100)) + '). The figures below are from the previous read.</div>';
  if (message) h += '<div class="warnbox">' + esc(message) + '</div>';
  $('status').innerHTML = h;

  /* this round */
  let r = '<h2>' + (w.phase === 'BEFORE_START' ? 'First round (round 0)' : 'Round ' + S.chainRound) + '</h2>';
  r += row('Pot', tok(cur.pot) + dollars(cur.pot));
  if (cur.pot === 0n) r += '<div class="warnbox">The pot of this round holds 0 TBLOCK. If it still holds 0 when the round ends, the winner receives 0.</div>';
  /* anyone can add to the pot: fund() is public. Always shown; the field appears once the room under the cap was read for this wallet. */
  let f = '<h2>Add TBLOCK to the pot</h2><p>Anyone can add to the pot of this round. The contract pays it to the winners by the rules below; nobody can take it back, you included.</p>';
  if (!wallet) f += '<div class="act"><button data-connect="1">Connect wallet to add</button></div>';
  else if (!my) f += '<p class="note">Reading this wallet…</p>';
  else if (S.clockMismatch) f += '<p class="note">The clock of this device and the chain disagree on the round; the field comes back when they agree.</p>';
  else {
    f += '<div id="fundBox">' + row('TBLOCK in this wallet', tok(my.balance)) + row('Room left under the cap', tok(my.room));
    if (my.room > 0n) {
      const most = my.balance < my.room ? my.balance : my.room;
      f += '<div class="act"><input class="a" id="fundAmt" inputmode="decimal" placeholder="TBLOCK amount" aria-label="TBLOCK amount to add">'
        + (most > 0n ? '<button class="ghost" data-max="' + esc(C.formatUnits18(most, 18).replace(/,/g, '')) + '">Max</button>' : '') + '<button data-fund="1">Add to the pot</button></div>';
    }
    f += '</div>';
  }
  f += '<p class="note">If the round does not pay, the pot is carried to later rounds, and what does not fit under their cap goes to the dead address.</p>';
  const typed = ($('fundAmt') || {}).value || ''; /* a refresh redraws the card: keep what the person was typing */
  $('fund').innerHTML = f; $('fund').hidden = false;
  if (typed && $('fundAmt')) $('fundAmt').value = typed;
  r += row('Blocks entered', String(cur.entryCount));
  r += row('Votes bought', String(cur.totalVotes));
  r += row('Entries that qualify', String(cur.qualifiedCount) + ' of the ' + p.minQualifiedEntries + ' needed ' + (S.qualified ? pill('round will pay', 'ok') : pill('round will not pay as it stands', 'warn')));
  if (!cur.entryCount) r += '<p class="mut">No block is entered in this round.</p>';
  for (const e of cur.entries) {
    r += '<div class="entry"><div class="top"><span>' + nameOf(e.blockToken) + '</span><span>' + (e.qualified ? pill('qualifies', 'ok') : pill('does not qualify yet', 'warn')) + '</span></div>'
      + row('Votes', String(e.votes) + ' (needs ' + p.minVotes + ')') + row('Different voting addresses', String(e.voters) + ' (needs ' + p.minVoters + ')') + row('Paid to, if it wins', scan(e.payee));
    if (w.phase === 'VOTE' && !S.clockMismatch) {
      if (wallet) r += '<div class="act"><input class="n" type="number" min="1" step="1" value="1" id="v' + e.id + '" aria-label="Number of votes"><button data-vote="' + e.id + '">Vote</button><span class="note">' + tok(p.votePrice) + ' per vote, not refundable'
        + (my && my.voted.get(e.id) ? ' · this wallet already voted here' : '') + '</span></div>';
      else r += '<div class="act"><button class="ghost" data-connect="1">Connect a wallet to vote</button></div>';
    }
    r += '</div>';
  }
  if (cur.entriesNotRead > 0) r += '<p class="note">' + cur.entriesNotRead + ' more entries exist and are not listed here.</p>';
  $('round').innerHTML = r; $('round').hidden = false;

  /* my wallet */
  let m = '<h2>Enter my block</h2>';
  if (!wallet) {
    m += '<p>Only the wallet recorded as the creator of a block can enter it. Connect that wallet to see which of its blocks the contract accepts.</p><div class="act"><button data-connect="1">Connect wallet</button></div>';
  } else {
    m += row('Wallet', scan(wallet)) + (my ? row('TBLOCK in this wallet', tok(my.balance)) : '');
    if (my && my.claimable > 0n) m += '<div class="warnbox">The contract holds ' + tok(my.claimable) + ' for this wallet (a payment that did not go through).<div class="act"><button data-claim="1">Claim it to this wallet</button></div></div>';
    if (w.phase === 'BEFORE_START') m += '<p>Entries are not open yet. The blocks below are checked now so you know where you stand.</p>';
    if (w.phase === 'VOTE') m += '<p>Entries for this round are closed. The next entry window opens at ' + esc(utc(w.roundEndsAt)) + '.</p>';
    if (w.phase === 'ENTRY') m += '<p>Entering costs ' + tok(p.entryFee) + dollars(p.entryFee) + '. It goes into the pot of the round and is not refundable.</p>' + (my && my.enteredBy ? '<p>' + pill('this wallet already has an entry in this round', 'ok') + ' One entry per wallet in each round.</p>' : '');
    if (mine.why) m += '<p class="note">' + esc(mine.why) + '</p>';
    for (const b of mine.list || []) {
      m += '<div class="entry"><div class="top"><span>' + nameOf(b.block) + '</span><span>' + (b.ok ? pill('you are its recorded creator', 'ok') : pill('cannot be entered', 'ko')) + '</span></div>';
      if (!b.ok) m += '<p class="note">' + esc(b.why) + '</p>';
      else if (b.entered) m += '<p class="note">Already entered in this round.</p>';
      else if (w.phase === 'ENTRY' && !S.clockMismatch && !(my && my.enteredBy)) m += '<div class="act"><button data-enter="' + esc(b.block) + '">Enter this block</button><span class="note">' + tok(p.entryFee) + ', not refundable</span></div>';
      m += '</div>';
    }
    m += '<div class="act"><input class="a" id="manual" placeholder="Block address (0x…)" aria-label="Block address"><button class="ghost" data-check="1">Check this block</button></div>';
  }
  $('me').innerHTML = m; $('me').hidden = false;

  /* rules, written from the values read */
  const toPot = C.BPS - p.burnBps, places = [['First', p.split1], ['second', p.split2], ['third', p.split3]].filter((x) => x[1] > 0n);
  const wasOpen = !!document.querySelector('#rules details[open]');
  let u = '<details' + (wasOpen ? ' open' : '') + '><summary>Rules, as the contract applies them</summary><ol>';
  u += '<li><b>Who can enter.</b> Only the wallet recorded as the creator of a block in the TokenizedBlock creator registry. One entry per block and one entry per wallet in each round.</li>';
  u += '<li><b>Entering.</b> ' + (p.entryFee > 0n ? 'Costs ' + tok(p.entryFee) + ', added to the pot of that round. Not refundable.' : 'Free.') + '</li>';
  u += '<li><b>Rounds.</b> A round lasts ' + esc(span(C.roundLength(p))) + ': ' + esc(span(p.entryPeriod)) + ' to enter, then ' + esc(span(p.votePeriod)) + ' to vote. The next round starts the second the previous one ends.</li>';
  u += '<li><b>Voting.</b> Anyone can vote, as many votes as they pay for. One vote costs ' + tok(p.votePrice) + '. ' + pct(p.burnBps) + ' of what you pay is sent to the dead address ' + scan(dead) + ', which nobody controls'
    + (toPot > 0n ? '; the other ' + pct(toPot) + ' goes to the pot' : '; none of it goes to the pot') + '. <b>Votes are not refundable</b>, whether the block wins or not.</li>';
  u += '<li><b>Rank.</b> More votes means a higher rank, so a first place can be bought. On equal votes, the block entered first is ahead.</li>';
  u += '<li><b>Qualifying.</b> An entry qualifies with at least ' + p.minVotes + ' votes coming from at least ' + p.minVoters + ' different addresses. The contract counts addresses, not people.</li>';
  u += '<li><b>When a round pays.</b> Only if at least ' + p.minQualifiedEntries + ' entries qualify. If not, nobody is paid: the pot is carried to later rounds, and what does not fit under their cap is sent to the dead address.</li>';
  u += '<li><b>What is paid.</b> ' + places.map((x) => x[0] + ' place: ' + pct(x[1]) + ' of the pot').join(', ') + '. A pot never exceeds ' + tok(p.maxPot) + dollars(p.maxPot) + '. The pot is what was deposited into the round plus its entry fees. Nobody is obliged to deposit; a pot can hold 0.</li>';
  u += '<li><b>Paying.</b> After a round ends, anyone can ask the contract to settle it. The contract then pays the recorded creator wallet by the rules above. No account can withdraw a pot or change these numbers.</li>';
  u += '</ol><p class="note">TBLOCK spent on votes or on an entry is gone. This page promises no gain. Contract: ' + scan(C.CONTEST) + '.</p>';
  $('rules').innerHTML = u + '</details>'; $('rules').hidden = false;

  /* past rounds */
  if (S.past.length) {
    let q = '<h2>Past rounds</h2>';
    for (const pr of S.past) {
      const o = pr.outcome, win = o.winner && !o.winner.notRead ? nameOf(o.winner.blockToken) + ' (paid to ' + scan(o.winner.payee) + ')' : 'entry ' + (o.winner ? o.winner.id : '');
      const txt = o.state === 'PAID' ? 'Settled. Winner: ' + win : o.state === 'TO_PAY' ? 'Ended, not settled yet. Leading: ' + win + '. Pot: ' + tok(pr.pot)
        : o.state === 'NO_WINNER' ? 'Settled with no winner: only ' + pr.qualifiedCount + ' of the ' + p.minQualifiedEntries + ' needed entries qualified. Its pot was carried forward.'
        : 'Ended, not settled yet. Only ' + pr.qualifiedCount + ' of the ' + p.minQualifiedEntries + ' needed entries qualified: nobody will be paid. Pot: ' + tok(pr.pot);
      q += '<div class="entry"><div class="top"><span><b>Round ' + pr.round + '</b></span><span class="note">' + pr.entryCount + ' entries · ' + pr.totalVotes + ' votes</span></div><p>' + txt + '</p>';
      if (!pr.settled) q += '<div class="act">' + (wallet ? '<button data-settle="' + pr.round + '">Settle round ' + pr.round + '</button>' : '<button class="ghost" data-connect="1">Connect a wallet to settle it</button>') + '<span class="note">Anyone can do this. It costs network fees only.</span></div>';
      q += '</div>';
    }
    $('past').innerHTML = q; $('past').hidden = false;
  } else $('past').hidden = true;

  $('foot').innerHTML = 'Read at ' + esc(utc(chainNow())) + ' (Base clock). Reserved by the contract for pots and unpaid amounts: ' + tok(S.liabilities) + '.'
    + (S.clockMismatch ? ' The clock of this device and the chain disagree on the current round; buttons are hidden until they agree.' : '');
}

/* ---------------------------------------------------------------- clicks */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button');
  if (!t || busy) return;
  const d = t.dataset;
  if (d.connect) return connect();
  if (!S || !wallet) return;
  if (d.vote !== undefined) {
    const id = Number(d.vote), n = Number(($('v' + id) || {}).value);
    if (!Number.isInteger(n) || n < 1 || n > 1000000) { message = 'Enter a whole number of votes, 1 or more.'; return render(); }
    const cost = C.voteCost(BigInt(n), P.votePrice);
    if (my && my.balance < cost) { message = n + ' vote(s) cost ' + C.formatUnits18(cost) + ' TBLOCK; this wallet holds ' + C.formatUnits18(my.balance) + '.'; return render(); }
    return send(C.voteBatch({ round: S.chainRound, entryId: BigInt(id), votes: BigInt(n), votePrice: P.votePrice }), n + ' vote(s) for ' + C.formatUnits18(cost) + ' TBLOCK, not refundable');
  }
  if (d.enter) {
    const b = (mine.list || []).find((x) => x.block === d.enter && x.ok);
    if (!b) return;
    if (my && my.balance < P.entryFee) { message = 'Entering costs ' + C.formatUnits18(P.entryFee) + ' TBLOCK; this wallet holds ' + C.formatUnits18(my.balance) + '.'; return render(); }
    return send(C.enterBatch({ blockToken: b.block, key: b.key, entryFee: P.entryFee }), 'entry of your block for ' + C.formatUnits18(P.entryFee) + ' TBLOCK, not refundable');
  }
  if (d.max) { const i = $('fundAmt'); if (i) i.value = d.max; return; }
  if (d.fund) {
    if (!my) return;
    const plan = C.fundPlan({ text: ($('fundAmt') || {}).value, room: my.room, balance: my.balance });
    if (!plan.ok) { message = plan.why; return render(); }
    return send(C.fundBatch({ round: S.chainRound, amount: plan.amount, room: my.room }), 'adding ' + C.formatUnits18(plan.amount) + ' TBLOCK to the pot of round ' + S.chainRound
      + (plan.clipped ? ' (cut to the room left under the cap)' : '') + ', not refundable');
  }
  if (d.settle !== undefined) return send([C.buildSettle(BigInt(d.settle))], 'settling round ' + d.settle);
  if (d.claim) return send([C.buildClaim(wallet)], 'claim to this wallet');
  if (d.check) {
    const a = String(($('manual') || {}).value || '').trim().toLowerCase();
    if (!/^0x[0-9a-f]{40}$/.test(a)) { message = 'That is not a full block address.'; return render(); }
    message = ''; return readMine(a);
  }
});

setInterval(() => {
  if (!S || busy) return;
  const el = $('cd');
  const w = C.phaseAt(P, chainNow());
  if (w.phase !== S.when.phase || w.round !== S.when.round) { S.when = w; refresh(); return; }
  if (el) el.textContent = C.formatDuration(w.secondsLeft);
}, 1000);
setInterval(() => { if (!busy && !document.hidden) refresh(); }, 45000);
refresh();
</script>
</body>
</html>
