<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deploy TBlockBuyback</title>
<!--
  game324 — the page that offers the UNSIGNED deployment of TBlockBuyback to the CONNECTED wallet (Grok's, on Phil's GO).
  ⛔ The data sent is EXACTLY tblock-buyback-deploiement.js (generated by contracts/preparer-deploiement-buyback.mjs), proven on a fork by
     banc-buyback-deploy-fork-20261109.mjs: same bytes. This page refuses any network but Base (8453) and shows what is signed.
-->
<style>
:root{--bg:#050d24;--card:#0f1d3d;--line:#1e2f57;--fg:#e9f0ff;--dim:#8ba0c9;--or:#f7a318}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:16px}
main{max-width:720px;margin:0 auto}h1{font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.k{color:var(--dim);flex:0 0 170px;font-size:12px}.v{flex:1;font-size:12px;word-break:break-all}
button{width:100%;background:var(--or);color:#20160a;border:0;border-radius:8px;padding:14px;font:inherit;font-weight:700;margin-top:10px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.note{color:var(--dim);font-size:12px}
</style>
<main>
<h1>Deploy TBlockBuyback (Base)</h1>
<p class="note">Buys TBLOCK with the ETH sent to it (ETH → wtCOIN → TBLOCK) and sends all of it to 0x…dEaD. At most 0.002 ETH per call, once an hour.
No owner, no withdraw. The keeper below calls it; anyone else only after 6 h of keeper silence.</p>
<div class="card" id="what"></div>
<div class="card">
  <button id="connect">Connect wallet</button>
  <button id="deploy" disabled>Deploy (sign in the wallet)</button>
  <div id="state" class="note" style="margin-top:10px"></div>
</div>
</main>
<script type="module">
import { BUYBACK_DEPLOIEMENT as D } from './tblock-buyback-deploiement.js';
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const row = (k, v) => '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
const P = D.parametres;
$('#what').innerHTML = row('contract', D.contrat) + row('network', 'Base mainnet (chain id ' + D.chaine + ')') + row('compiler', D.compilateur)
  + row('sha256 of the source', D.sha256Source) + row('sha256 of the data signed', D.sha256Creation) + row('size', D.octetsCreation + ' bytes')
  + row('keeper', P.keeper) + row('per call / cooldown', '0.002 ETH / ' + P.cooldown + ' s') + row('public after', P.publicDelay + ' s of keeper silence')
  + row('TBLOCK', P.tblock) + row('TBLOCK/wtCOIN pool key', P.v4Key.join(' · ')) + row('WETH/wtCOIN pool', P.v3Pool)
  + row('price guards', 'average price over ' + P.twapWindow + ' s (max ' + P.maxV3DevTicks + ' ticks off), own impact ≤ ' + P.maxV4ImpactTicks + ' ticks, pool hook cut ≤ ' + P.maxHookPpm + ' ppm');
/* already deployed (read on chain): show it and never offer a second deployment */
if (D.adresse) {
  $('#what').innerHTML = row('DEPLOYED AT', D.adresse) + row('block', D.bloc) + row('transaction', D.tx) + $('#what').innerHTML;
  $('#connect').disabled = true; $('#deploy').disabled = true;
  $('#state').innerHTML = 'Already deployed: <a href="https://basescan.org/address/' + esc(D.adresse) + '" target="_blank" rel="noopener">' + esc(D.adresse) + '</a>. Fund it with a normal ETH transfer.';
}
let acct = null;
async function sha256Hex(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
$('#connect').onclick = async () => {
  if (!window.ethereum) { $('#state').textContent = 'No wallet in this browser.'; return; }
  try { [acct] = await window.ethereum.request({ method: 'eth_requestAccounts' }); } catch (e) { $('#state').textContent = 'Wallet refused: ' + (e.message || e); return; }
  const chain = parseInt(await window.ethereum.request({ method: 'eth_chainId' }), 16);
  const shaOk = (await sha256Hex(D.creation)) === D.sha256Creation;
  $('#state').innerHTML = 'Connected: ' + esc(acct) + ' · network ' + chain + (chain === 8453 ? '' : ' — switch to Base first') + ' · data integrity ' + (shaOk ? 'OK' : 'MISMATCH');
  $('#deploy').disabled = !(chain === 8453 && shaOk);
};
$('#deploy').onclick = async () => {
  $('#deploy').disabled = true;
  let h;
  try { h = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: acct, data: D.creation }] }); }
  catch (e) { $('#state').textContent = 'Not sent: ' + (e.message || e); $('#deploy').disabled = false; return; }
  $('#state').innerHTML = 'Sent: <a href="https://basescan.org/tx/' + esc(h) + '" target="_blank" rel="noopener">' + esc(h) + '</a> · waiting for the receipt…';
  let r = null;
  for (let k = 0; k < 90 && !r; k++) { r = await window.ethereum.request({ method: 'eth_getTransactionReceipt', params: [h] }).catch(() => null); if (!r) await new Promise((o) => setTimeout(o, 2000)); }
  if (!r) { $('#state').innerHTML += ' · no receipt yet: check Basescan.'; return; }
  $('#state').innerHTML = (r.status === '0x1' ? 'Deployed at <b>' + esc(r.contractAddress) + '</b>' : 'FAILED on chain') + ' · tx <a href="https://basescan.org/tx/' + esc(h) + '" target="_blank" rel="noopener">' + esc(h) + '</a>';
};
</script>
